emcl2:
  ros__parameters:
    odom_freq: 20
    transform_tolerance: 0.2
    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_link"
    footprint_frame_id: "base_link"
    laser_min_range: 0.0
    laser_max_range: 100000000.0
    scan_increment: 1
    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_a: 0.0
    num_particles: 500
    alpha_threshold: 0.5
    expansion_radius_position: 0.1
    expansion_radius_orientation: 0.2
    extraction_rate: 0.1
    range_threshold: 0.3
    sensor_reset: false
    odom_fw_dev_per_fw: 0.19
    odom_fw_dev_per_rot: 0.01 
    odom_rot_dev_per_fw: 0.13
    odom_rot_dev_per_rot: 0.2
    laser_likelihood_max_dist: 0.8

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    default_nav_to_pose_bt_xml: /home/takumi/ros2_ws/src/orne-box/orne_box_navigation_executor/config/behavior_trees/navigate_w_replanning_and_recovery.xml
    default_nav_through_poses_bt_xml: /home/takumi/ros2_ws/src/orne-box/orne_box_navigation_executor/config/behavior_trees/navigate_w_replanning_and_recovery.xml
